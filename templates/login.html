<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermSender Pro - Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .login-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: var(--bg-primary);
      }
      .login-card {
        background-color: var(--bg-card);
        border-radius: 8px;
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .login-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        color: var(--text-primary);
        font-size: 1.5rem;
        font-weight: 600;
      }
      .login-logo i {
        margin-right: 0.5rem;
        color: var(--brand-primary);
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .login-input {
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 0.75rem 1rem;
        color: var(--text-primary);
        width: 100%;
        font-size: 1rem;
      }
      .login-input:focus {
        border-color: var(--border-focus);
        outline: none;
      }
      .login-button {
        background-color: var(--brand-primary);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .login-button:hover {
        background-color: var(--brand-secondary);
      }
      .login-error {
        color: var(--brand-danger);
        margin-top: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <i class="fas fa-paper-plane"></i>
          <span>TermSender Pro</span>
        </div>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div style="color:var(--brand-primary);margin-top:1rem;text-align:center">{{ message }}</div>
        {% endif %}

        <form class="login-form" method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}" />
          <input
            type="email"
            name="email"
            class="login-input"
            placeholder="Email address"
            required
          />
          <input type="password" name="password" class="login-input" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="login-button">Sign in</button>
        </form>
        <p style="text-align:center;margin-top:1rem;color:var(--text-secondary)"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
        <p style="text-align:center;margin-top:1rem;color:var(--text-secondary)">Have a license? <a href="{{ url_for('register') }}">Create your account</a></p>
      </div>
    </div>
  </body>
</html>
