<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate TermSender account</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--bg-primary);color:var(--text-primary);font-family:Inter,system-ui,sans-serif}.card{width:min(440px,calc(100% - 2rem));padding:2rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;box-shadow:var(--shadow-md)}h1{font-size:1.4rem;margin-bottom:.5rem}.sub{color:var(--text-secondary);margin-bottom:1.4rem}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border-radius:7px;border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary)}button{width:100%;margin-top:.7rem;padding:.85rem;background:var(--brand-primary);color:#fff;border:0;border-radius:7px;font-weight:700;cursor:pointer}.error{padding:.75rem;background:#571d24;color:#ffdadd;border-radius:7px;margin:1rem 0}a{color:var(--brand-primary)}</style></head>
<body><main class="card"><h1>Activate your account</h1><p class="sub">Enter the email your license was issued to, then choose your own password.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('register') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token_value }}"><div class="field"><label for="name">Name</label><input id="name" name="name" maxlength="100" autocomplete="name" required></div><div class="field"><label for="email">Licensed email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required></div><div class="field"><label for="license_key">License key</label><input id="license_key" name="license_key" autocomplete="off" required></div><div class="field"><label for="password">Choose password (12+ characters)</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required></div><button type="submit">Activate account</button></form><p style="margin-top:1rem;text-align:center"><a href="{{ url_for('login') }}">Back to sign in</a></p></main></body></html>
