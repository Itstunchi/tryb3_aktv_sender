<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recover password - TermSender Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; background: var(--bg-primary); color: var(--text-primary); font-family: Inter, system-ui, sans-serif; }
      .card { width: min(400px, calc(100% - 2rem)); padding: 2rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; }
      .field { display: grid; gap: .4rem; margin: 1rem 0; }
      input { padding: .8rem; border-radius: 7px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); }
      button { width: 100%; margin-top: .7rem; padding: .85rem; background: var(--brand-primary); color: #fff; border: 0; border-radius: 7px; font-weight: 700; cursor: pointer; }
      .notice, .error { margin: 1rem 0; text-align: center; }
      .error { color: var(--brand-danger); }
      a { color: var(--brand-primary); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Recover administrator password</h1>
      <p>Enter the administrator login email. The one-time code is delivered only to the configured recovery mailbox.</p>
      {% if message %}<p class="notice">{{ message }}</p>{% endif %}
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}" />
        <div class="field">
          <label for="email">Administrator email</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required />
        </div>
        <button type="submit">Send recovery code</button>
      </form>
      <p style="text-align:center;margin-top:1rem"><a href="{{ url_for('reset_password') }}">I already have a code</a></p>
      <p style="text-align:center"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </main>
  </body>
</html>
